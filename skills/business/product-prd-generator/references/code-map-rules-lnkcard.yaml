project: lnkcard
description: >-
  LnkCard 初始产品基线。首轮代码仓仅有 onboarding/OpenSpec 空骨架；不使用
  LnkCRE alignment matrix，也不启用直接代码或测试文件扫描，避免把无业务代码的空集
  误读为已验证能力缺失。代码 authority 与 scan coverage 应明确标记。
specs:
  path: openspec/specs
matrix:
  enabled: false
future_scanners:
  direct_runtime_sources:
    enabled: false
    note: 没有业务实现代码，首次运行禁止使用静态关键词扫描替代实现基线。
  tests:
    enabled: false
    note: 尚无业务代码/测试，尚未实施测试扫描。
exclude_paths:
  - "**/.git/**"
  - "**/.opencode/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/__pycache__/**"
# 早期产品开关：本体目标能力作为 roadmap 项（missing 规划项）进入功能清单；
# 成熟产品保持默认 false，走 spec 驱动流程，避免淹没既有清单。
ontology_roadmap_seeding: true
