    term_aliases: /opt/code/docs/lanlnk/30-products/lnkchat/term-aliases.yaml
    prd_root: /opt/code/docs/lanlnk/30-products/lnkchat/prd   # confirmed（feedback v2 2026-09-26；PRD-LC-* 系列 40+ 文件）
    adapter_status: partial

  lnkvision:
