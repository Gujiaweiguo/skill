  lnkwebsite:
    display_name: 蓝联科技官网（LnkWebsite）
    kind: business
    product_class: business
    ontology_profile: null        # prd-only：不建本体层（owner 2026-09-27 裁定）
    docs_root: /opt/code/docs/lanlnk/30-products/lnkwebsite
    code_root: /opt/code/lnkwebsite
    ontology: null        # prd-only（owner 2026-09-27 裁定不建本体层；governance README 声明 out of software product contract）；解析显式降级拒绝回落商管
