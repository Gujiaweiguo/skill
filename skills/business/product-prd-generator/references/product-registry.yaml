# Product Registry —— 三层模型产品注册表（本体 / PRD / 代码）
#
# 规则：
# 1. 新产品加入 = 补一条 entry；路径未确认一律写 null + *_note 说明，不编造。
# 2. 未知/未注册产品必须显式降级说明，禁止静默回退到商管 ontology。
# 3. ontology 指向该产品本体层主入口文件；本体层允许多文件（见 product-semantic-baseline.md §1）。
# 4. model_kind 等旧分类字段仅为可选内部提示，不作为入口概念。
# 5. lnkcre 条目：canonical root 为 30-products/lnkcre；mi-cre 目录已于 2026-09
#    三层整理中合并删除（legacy_* fallback 字段随之移除）。MI-* / MI-CRE-* 文档 ID
#    与 mi-cre 路径段别名（历史文档识别用）保持不变。
# 6. 代码侧路径解析唯一权威源是 skill 的 _paths.resolve_product_paths()，
#    本表与其保持同步（改一边必须改另一边）。
#
# unresolved 字段由 docs 侧整理（docs-reorg-prompt）产出 registry-feedback 后回填
# （2026-09-24 已回填：30-products/product-registry-feedback.yaml；2026-09-26
# owner 已确认全部 proposed docs_root 及 lnkvision ontology 路径）。

products:
  lnkcre:
    display_name: LnkCRE 商管系统
    aliases: [MI, MI-CRE, 商管系统, lnkcre, LnkCRE]   # canonical product id = lnkcre
    model_kind_hint: operational-domain-model   # legacy 内部提示，非入口概念
    docs_root: /opt/code/docs/lanlnk/30-products/lnkcre
    history_note: mi-cre 为历史命名（目录已于 2026-09 合并删除）；MI-* / MI-CRE-* 文档 ID 稳定不变
    code_root: /opt/code/lnkcre
    ontology: /opt/code/docs/lanlnk/config/ontology/business-ontology.yaml
    ontology_note: docs 侧本体入口见 30-products/lnkcre/ontology/README.md（指向 config/ontology 与 20-architecture/mi-cre/domain-model/）
    ontology_extra:
      - /opt/code/docs/lanlnk/20-architecture/mi-cre/domain-model/   # 历史 MI-CRE 文档性领域模型（docs 侧原位保留，不迁移）
    prd_root: /opt/code/docs/lanlnk/30-products/lnkcre/prd
    feature_baseline: /opt/code/docs/lanlnk/30-products/lnkcre/prd/baseline/feature-baseline.yaml
    competitor_evidence_root: /opt/code/docs/lanlnk/30-products/lnkcre/evidence/competitors
    term_aliases: null    # 复用 skill references/term-aliases.yaml
    adapter_status: implemented

  lnkreport:
    display_name: LnkReport 自助分析平台
    model_kind_hint: capability-model
    docs_root: /opt/code/docs/lanlnk/30-products/lnkreport   # confirmed（feedback 2026-09-24，owner 确认 2026-09-26）
    code_root: /opt/code/lnkreport
    ontology: /opt/code/docs/lanlnk/out/prd/lnkreport/output/ontology.yaml
    ontology_note: generated/supporting（INDEX.md：canonical unresolved，authority 边界待裁决）
    term_aliases: /opt/code/docs/lanlnk/out/prd/lnkreport/output/term-aliases.yaml
    adapter_status: partial

  lnkchatbi:
    display_name: LnkChatBI（= mysqlbot = SQLBot，同一产品族）
    model_kind_hint: capability-model
    docs_root: /opt/code/docs/lanlnk/30-products/lnkchatbi   # confirmed（feedback 2026-09-24，owner 确认 2026-09-26）
    code_root: null       # unresolved: /opt/code/lnkchatbi 未发现代码仓（INDEX.md）
    ontology: /opt/code/docs/lanlnk/out/prd/LnkChatBI/output/ontology.yaml
    term_aliases: /opt/code/docs/lanlnk/out/prd/LnkChatBI/output/term-aliases.yaml
    adapter_status: partial

  lnkchat:
    display_name: LnkChat 岗位 AI 工作流平台（langchat 基座）
    model_kind_hint: product-runtime-model
    docs_root: /opt/code/docs/lanlnk/30-products/lnkchat
    code_root: /opt/code/lnkchat
    ontology: /opt/code/docs/lanlnk/30-products/lnkchat/ontology.yaml
    term_aliases: /opt/code/docs/lanlnk/30-products/lnkchat/term-aliases.yaml
    adapter_status: partial

  lnkvision:
    display_name: LnkVision
    model_kind_hint: null
    docs_root: /opt/code/docs/lanlnk/30-products/lnkvision   # confirmed（feedback 2026-09-24，owner 确认 2026-09-26）
    code_root: /opt/code/lnkvision
    ontology: /opt/code/docs/lanlnk/out/prd/LnkVision/域知识.md   # confirmed（owner 2026-09-26）；generated/supporting，canonical authority 待裁决
    term_aliases: null
    adapter_status: unsupported

  lnkgateway:
    display_name: LnkGateway
    model_kind_hint: null
    docs_root: /opt/code/docs/lanlnk/30-products/lnkgateway   # confirmed（feedback 2026-09-24，owner 确认 2026-09-26）
    code_root: /opt/code/lnkgateway
    ontology: null        # unresolved（INDEX.md：无已确认 docs ontology 候选）
    term_aliases: null
