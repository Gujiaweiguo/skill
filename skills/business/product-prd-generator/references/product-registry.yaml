    code_root: /opt/code/lnkvision
    prd_root: /opt/code/docs/lanlnk/30-products/lnkvision/prd   # 2026-09-26 方案 B 迁移：PRD 家族自 out/prd/LnkVision/output/ 迁入
    ontology: /opt/code/docs/lanlnk/30-products/lnkvision/ontology/域知识.md   # 2026-09-26 升格 canonical 本体（原 out/prd/LnkVision/域知识.md，owner 确认）
    ontology_note: 域知识.md 已升格为 canonical 本体，位于 30-products/lnkvision/ontology/（含 README.md 权威指针）
