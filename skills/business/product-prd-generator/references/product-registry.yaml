  lnkcrm:
    display_name: LnkCRM 商圈会员 CRM 系统
    kind: business
    product_class: business
    ontology_profile: business-ontology
    docs_root: /opt/code/docs/lanlnk/30-products/lnkcrm   # confirmed（OPC 2026-10-02）
