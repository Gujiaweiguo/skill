    ontology: /opt/code/docs/lanlnk/30-products/lnkreport/ontology/ontology.yaml   # 2026-09-26 迁移（原 out/prd/lnkreport/output/ontology.yaml）
    ontology_note: canonical 在位（30-products/lnkreport/ontology/，含 README.md 权威指针）
    term_aliases: /opt/code/docs/lanlnk/30-products/lnkreport/ontology/term-aliases.yaml   # 2026-09-26 迁移
    adapter_status: partial

  lnkchatbi:
