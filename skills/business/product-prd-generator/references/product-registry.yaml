# Product Registry —— 三层模型产品注册表（本体 / PRD / 代码）
#
# 规则：
# 1. 新产品加入 = 补一条 entry；路径未确认一律写 null + *_note 说明，不编造。
# 2. 未知/未注册产品必须显式降级说明，禁止静默回退到商管 ontology。
# 3. ontology 指向该产品本体层主入口文件；本体层允许多文件（见 product-semantic-baseline.md §1）。
# 4. model_kind 等旧分类字段仅为可选内部提示，不作为入口概念。
# 5. lnkcre 条目：canonical root 为 30-products/lnkcre；mi-cre 目录已于 2026-09
#    三层整理中合并删除（legacy_* fallback 字段随之移除）。MI-* / MI-CRE-* 文档 ID
#    与 mi-cre 路径段别名（历史文档识别用）保持不变。
# 6. 代码侧路径解析唯一权威源是 skill 的 _paths.resolve_product_paths()，
#    本表与其保持同步（改一边必须改另一边）。
# 7. 2026-09-26 方案 B 家族迁移（owner 批准）：lnkreport / lnkvision / lnkchatbi 的
#    canonical PRD 家族与本体自 out/prd/<项目>/output/ 迁入 30-products/<产品>/{prd,ontology}/；
#    out/prd/ 降为纯生成区（skill 生成产物仍落 out/，经 owner 审后"晋升"并入 canonical，
#    双源不并存，晋升流程见各产品 30-products/<产品>/prd/README.md）。
#    docs_root 字段即 canonical root（全部产品均在 30-products/ 下），不另设
#    canonical_root 重复字段。
# 8. _PRODUCT_CANONICAL_DIR 已登记 lnkreport/lnkchatbi/lnkvision（2026-09-26 同日修复，
#    回归闸 tests/test_paths.py；lnkvision 无 ontology.yaml，canonical 本体为域知识.md，
#    以本表登记为准）。未注册产品 tier-4 商管兜底带跨域污染闸门（非 lanlnk 公司
#    报错引导注册，lanlnk 公司警告）。本表与代码解析保持同步。
#
# unresolved 字段由 docs 侧整理（docs-reorg-prompt）产出 registry-feedback 后回填
# （2026-09-24 已回填：30-products/product-registry-feedback.yaml；2026-09-26
# owner 已确认全部 proposed docs_root 及 lnkvision ontology 路径）。

products:
  lnkcre:
    display_name: LnkCRE 商管系统
    kind: business
    aliases: [MI, MI-CRE, 商管系统, lnkcre, LnkCRE]   # canonical product id = lnkcre
    model_kind_hint: operational-domain-model   # legacy 内部提示，非入口概念
    docs_root: /opt/code/docs/lanlnk/30-products/lnkcre
    history_note: mi-cre 为历史命名（目录已于 2026-09 合并删除）；MI-* / MI-CRE-* 文档 ID 稳定不变
    code_root: /opt/code/lnkcre
    ontology: /opt/code/docs/lanlnk/config/ontology/business-ontology.yaml
    ontology_note: docs 侧本体入口见 30-products/lnkcre/ontology/README.md（指向 ontology/architecture/ 领域模型、ontology/capability-matrix/ 能力矩阵、config/ontology/business-ontology.yaml 机器本体）
    ontology_extra:
      - /opt/code/docs/lanlnk/30-products/lnkcre/ontology/architecture/domain-model/   # LnkCRE 领域模型（2026-09-26 归位产品本体层，文档层 canonical；运行权威在 /opt/code/lnkcre/openspec/specs/）
    prd_root: /opt/code/docs/lanlnk/30-products/lnkcre/prd
    feature_baseline: /opt/code/docs/lanlnk/30-products/lnkcre/prd/baseline/feature-baseline.yaml
    competitor_evidence_root: /opt/code/docs/lanlnk/30-products/lnkcre/evidence/competitors
    term_aliases: null    # 复用 skill references/term-aliases.yaml
    adapter_status: implemented

  lnkreport:
    display_name: LnkReport 自助分析平台
    kind: tool
    model_kind_hint: capability-model
    docs_root: /opt/code/docs/lanlnk/30-products/lnkreport   # confirmed（feedback 2026-09-24，owner 确认 2026-09-26）
    code_root: /opt/code/lnkreport
    prd_root: /opt/code/docs/lanlnk/30-products/lnkreport/prd   # 2026-09-26 方案 B 迁移：功能清单/PRD 家族自 out/prd/lnkreport/output/ 迁入
    ontology: /opt/code/docs/lanlnk/30-products/lnkreport/ontology/ontology.yaml   # 2026-09-26 迁移（原 out/prd/lnkreport/output/ontology.yaml）
    ontology_note: canonical 在位（30-products/lnkreport/ontology/，含 README.md 权威指针）
    term_aliases: /opt/code/docs/lanlnk/30-products/lnkreport/ontology/term-aliases.yaml   # 2026-09-26 迁移
    adapter_status: partial

  lnkchatbi:
    display_name: LnkChatBI（= mysqlbot = SQLBot，同一产品族）
    kind: tool
    model_kind_hint: capability-model
    docs_root: /opt/code/docs/lanlnk/30-products/lnkchatbi   # confirmed（feedback v2 2026-09-26 闭环）
    code_root: /opt/code/lnkchatbi   # confirmed（owner 2026-09-26；docs 侧 feedback v2 已同步）
    prd_root: /opt/code/docs/lanlnk/30-products/lnkchatbi/prd   # 2026-09-26 方案 B 迁移：PRD 家族自 out/prd/LnkChatBI/output/ 迁入
    ontology: /opt/code/docs/lanlnk/30-products/lnkchatbi/ontology/ontology.yaml   # 2026-09-26 迁移（原 out/prd/LnkChatBI/output/ontology.yaml）
    ontology_note: canonical 在位（30-products/lnkchatbi/ontology/，含 README.md 权威指针）；canonical 仍 proposed（owner 2026-09-26）
    term_aliases: /opt/code/docs/lanlnk/30-products/lnkchatbi/ontology/term-aliases.yaml   # 2026-09-26 迁移
    adapter_status: partial

  lnkchat:
    display_name: LnkChat 岗位 AI 工作流平台（langchat 基座）
    kind: tool
    model_kind_hint: product-runtime-model
    docs_root: /opt/code/docs/lanlnk/30-products/lnkchat
