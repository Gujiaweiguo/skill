# =============================================================================
# V5 领域驱动方案 — Slide 配置规范（Schema Reference）
# =============================================================================
# 本文件是 compile_v5_domain.py 的配置契约。
# 编译器读取此格式的 YAML，零代码生成完整 PPT。
#
# 用法：
#   python compile_v5_domain.py <config.yaml>
#
# 每个 case 写一个独立 YAML 配置（参考 佛山若有光商业_v5.yaml）。
# =============================================================================

# ── Meta：项目元信息 ──
meta:
  customer_name: "佛山若有光商业"          # 客户全称（用于封面/文件名）
  customer_short: "佛山若有光"             # 客户简称（用于文件名）
  project_name: "佛山若有光商业"            # 项目目录名
  version: "V5"                           # 版本号
  date: "2026年7月"                       # 方案日期
  subtitle: "商管系统 + 会员CRM + AI岗位数字人"  # 封面副标题

# ── Paths：输入输出路径 ──
paths:
  base_ppt: "/opt/code/docs/lanlnk/incoming/会员客户需求/正祥选型方案/蓝联科技CRM商圈会员数智营销方案_202604.pptx"
  output: "$PROPOSALS_DIR/佛山若有光商业/蓝联科技商业地产数智化解决方案_佛山若有光商业_V5_20260728.pptx"
  # 环境变量 $PROPOSALS_DIR / $LANLNK_BASE 会被自动展开

# ── Palette（可选）：覆盖默认调色板 ──
# 不写则使用默认 palette（见 compile_v5_domain.py DEFAULT_PALETTE）
palette:
  ink:    "#18243B"    # 标题深色
  body:   "#3D4A5C"    # 正文
  muted:  "#8A94A6"    # 辅助/来源
  blue:   "#2C5DE6"    # 主色
  blue_dk: "#1E47B8"   # 深蓝强调
  blue_lt: "#D8E4FA"   # 浅蓝填充
  blue_bg: "#F5F8FE"   # 极浅蓝背景（右栏）
  green:  "#0EA56F"    # 正向数字
  teal:   "#61C9BD"    # 辅助色
  amber:  "#F59E1B"    # 注意色
  line:   "#E2E8F0"    # 分割线
  font:   "Microsoft YaHei"
  title_font: "Alibaba PuHuiTi Bold"

# ── Cover：封面配置 ──
cover:
  # 封面主标题替换：匹配 base PPT 封面中的原文字，替换为新标题
  match_text: "商圈会员数字营销解决方案"       # base PPT 中的原始标题文字
  new_title: "商业地产数智化解决方案"          # 替换为的新标题
  title_size: 40                             # pt
  subtitle: "佛山若有光商业 · 商管系统 + 会员CRM + AI岗位数字人"
  subtitle_y: 5.2        # inches，副标题 Y 位置
  date_y: 5.9            # inches，日期 Y 位置

# ── P3 Fix（可选）：修复 base PPT P3 文字溢出 ──
p3_fix:
  enabled: true
  match_text: "蓝联科技"       # 匹配含此文字且超长的文本框
  font_size: 11               # pt，设置字号
  word_wrap: true

# ── Product Overview（可选）：替换 base PPT 的产品全景页 ──
# 如不配置则保留 base PPT 原页
product_overview:
  replace_base_index: 4       # 替换 base PPT 第几页（0-indexed）
  title: "蓝联产品全景：商管底座 + 会员CRM + AI岗位数字人"
  footer: "底座数字化 → AI自动化 → 净降本+经营增量"
  products:
    - name: "MI商管系统"
      tagline: "商业地产核心ERP"
      color: "blue"           # palette 中的颜色名
      features:               # 功能列表（>6 个自动分两列）
        - "资源管理"
        - "招商管理"
        - "合同管理"
        - "计费财务"
        - "调账引擎"
        - "营运管理"
        - "物业管理"
        - "预算管理"
        - "报表中心"
    - name: "会员CRM"
      tagline: "三端会员营销平台"
      color: "teal"
      features: [...]
    - name: "langchat"
      tagline: "AI 岗位数字人"
      color: "amber"
      features: [...]

# ── TOC：目录页配置 ──
toc:
  sections:                          # 4 个章节名（≤10 字/段）
    - "公司介绍与案例"
    - "对客户需求的理解"
    - "蓝图：商管+会员+AI 逐域实现"
    - "项目实施与预算"
  divider_indices: [1, 36, 9, 55]   # base PPT 中对应目录页的 slide index（0-indexed）

# =============================================================================
# Slides：自定义页列表（核心）
# =============================================================================
# 每个 slide 有一个 type 字段决定布局模板。
# 编译器按顺序生成所有 slides，然后按 reorder 配置重排。
# =============================================================================

slides:

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: requirement_projects — 项目拓扑图（首期试点 + 二期/三期列表）
  # ════════════════════════════════════════════════════════════════════════
  - type: requirement_projects
    title: "5个项目业态跨度大，标准商管软件无法覆盖"
    pilot:                              # 首期试点项目
      name: "盐步老龙1432"
      type: "文旅商业"
      desc: "13子节点·景区混合"
      detail: "景区+商业混合经营，子节点独立编码，业态最复杂，是全岗位激活的旗舰示范。"
    phase2_label: "二期/三期"
    others:                            # 其余项目列表
      - { name: "光之水岸", type: "滨水商业", desc: "4.8万㎡·遗址演艺" }
      - { name: "奇遇里", type: "街区商业", desc: "7创意盒子·主理人" }
      - { name: "金沙水街", type: "公园商业", desc: "草地·体育·营地" }
      - { name: "紫泉会馆", type: "社区会馆", desc: "30间·会员专属" }
    so_what: ["需要'一套底层×5套参数'", "不是又一套标准软件", "按岗位优先级分批激活"]
    source: "蓝联分析 · 2026年7月"

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: requirement_roles — 岗位痛点网格（N 岗位 × 2 列布局）
  # ════════════════════════════════════════════════════════════════════════
  - type: requirement_roles
    title: "6个岗位25个痛点，核心是数据散、工具弱、靠人工"
    roles:                             # 自动分 2 列排布
      - { name: "总经理", pain: "看不清租收情况，异常发现晚" }
      - { name: "招商", pain: "资源不清，底价靠拍，续租被动" }
      - { name: "营运", pain: "商户好坏看不准，日报靠拼" }
      - { name: "企划", pain: "活动效果难量化，客流留不住" }
      - { name: "物业", pain: "抄表脱节，报修无闭环" }
      - { name: "财务", pain: "业财对不上，报表靠Excel" }
    so_what: ["传统软件只记录数据", "蓝联用AI把数据变行动建议", "工具+AI双层方案"]
    source: "蓝联岗位痛点分析"

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: requirement_pain_detail — 痛点详解（3 角色列，每列 N 条）
  # ════════════════════════════════════════════════════════════════════════
  - type: requirement_pain_detail
    title: "总经理/招商/营运：最需要的是结论而非更多报表"
    categories:                        # 3 列
      - { role: "总经理", items: ["看不清租没租出去", "看不准能收多少", "异常发现晚", "经营质量难评价"] }
      - { role: "招商", items: ["5项目资源不清", "底价靠经验", "品牌储备不足", "续租被动"] }
      - { role: "营运", items: ["商户好坏看不准", "简单淘汰品牌", "进退场不可控", "日报靠人工拼"] }
    so_what: [...]
    source: "岗位痛点详解①"

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: requirement_matrix — 需求强度热力图（项目×岗位，1-5 星）
  # ════════════════════════════════════════════════════════════════════════
  - type: requirement_matrix
    title: "5个项目需求强度各有侧重，一套方案分层激活"
    headers: ["总经理", "招商", "营运", "财务", "企划", "物业"]
    rows:                              # 每行：项目名 + 强度数组（1-5）
      - { label: "盐步老龙", values: [5, 5, 4, 4, 5, 3] }
      - { label: "光之水岸", values: [3, 4, 4, 3, 4, 3] }
      - { label: "奇遇里", values: [3, 4, 4, 3, 5, 2] }
      - { label: "金沙水街", values: [3, 3, 3, 3, 4, 4] }
      - { label: "紫泉会馆", values: [2, 2, 4, 3, 3, 3] }
    legend: "● 需求强    ○ 需求弱"
    so_what: [...]
    source: "5项目×6岗位需求强度分析"

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: blueprint — 蓝图：2 层架构图（上层 AI Skills + 下层底座系统）
  # ════════════════════════════════════════════════════════════════════════
  - type: blueprint
    title: "底层数字化 + 上层AI自动化 = 净降本+经营增量"
    layer2:                            # 上层：AI Skills
      label: "第2层　langchat 岗位数字人"
      skills: ["智能问数", "营运分析", "Content OS", "客服分流", "财务账龄"]
      footer: "AgentOps 持续运营 · AI助手定期升级技能"
    connection: "↑ 数据驱动　　　↓ 智能决策"   # 两层之间的连接文字
    layer1:                            # 下层：底座
      mi:                              # MI 商管
        label: "MI商管系统"
        modules: ["资源", "合同", "计费财务", "调账", "营运", "物业"]  # 3列×2行网格
      crm:                             # 会员 CRM
        label: "会员CRM"
        ends: ["管理后台", "会员小程序", "商户助手"]
    so_what: [...]
    source: "蓝联2层方案架构"

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: domain_badge_cards — 彩色徽章卡片网格（如资源类型）
  # ════════════════════════════════════════════════════════════════════════
  - type: domain_badge_cards
    title: "资源域：7类资源全管，5项目业态一套系统覆盖"
    badges:                            # 自动 3 列网格
      - { cn: "铺位", en: "shop_unit", color: "blue" }
      - { cn: "演艺场地", en: "venue", color: "teal" }
      - { cn: "创意盒子", en: "multi_business_point", color: "amber" }
      - { cn: "广告位", en: "ad_board", color: "blue" }
      - { cn: "外摆区", en: "outdoor", color: "green" }
      - { cn: "车位", en: "parking", color: "teal" }
      - { cn: "仓库", en: "warehouse", color: "blue" }
    columns: 3                         # 网格列数（默认 3）
    bottom_bar: { text: "自定义字段：盐步老龙加'文保级别' · 奇遇里加'盒子编号'", color: "teal" }
    so_what: [...]
    source: "MI商管系统 · 已生产验证"

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: domain_lifecycle — 生命周期阶段图（如合同管理）
  # ════════════════════════════════════════════════════════════════════════
  - type: domain_lifecycle
    title: "合同域：全生命周期管理，审批可追溯"
    phases:                            # 每阶段一行
      - { name: "签约阶段", steps: ["意向登记", "条件谈判", "法务审核", "签批生效"], color: "blue" }
      - { name: "履行阶段", steps: ["条款履行", "变更管理", "续签管理"], color: "teal" }
      - { name: "终止阶段", steps: ["到期预警", "终止清算", "保证金退还"], color: "amber" }
    capabilities:                      # 底部关键能力 3 列
      - { key: "4类合同", val: "租赁/多种经营/广告/场地" }
      - { key: "11类条款", val: "固定/递增/抽成/免租期/保证金…" }
      - { key: "审批流", val: "法务→财务→总经理逐级签批" }
    bottom_bar: { text: "到期前3-6个月主动预警 · 变更全流程留痕 · 续租从被动变主动", color: "teal" }
    so_what: [...]
    source: "MI商管合同管理 · 已生产验证"

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: domain_big_number_flow — 大数字 + 流程步骤（如计费财务）
  # ════════════════════════════════════════════════════════════════════════
  - type: domain_big_number_flow
    title: "计费财务域：出账从天级降到分钟级，人力降70%+"
    big_number: { num: "70%+", label: "出账人力下降", color: "green" }
    flow: ["计费配置", "一键出账", "收款核销", "账龄催缴", "发票管理"]
    flow_description: "11类条款智能计算 → 聚合支付自动核销 → 账龄分级流程化催缴 → 业财凭证集成"
    bottom_bar: { text: "MI最强链路：计费→出账→收款→账龄→发票 全闭环", color: "green" }
    so_what: [...]
    source: "MI商管系统 · 已生产验证"

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: domain_comparison — before/after 对比框（如调账域）
  # ════════════════════════════════════════════════════════════════════════
  - type: domain_comparison
    title: "调账域：合同变更自动冲红重算，5分钟完成"
    before:
      label: "传统人工补单"
      value: "2-3天"
      description: "差错多 · 时滞长\n逐笔人工核对冲红重算"
      bg: "gray_light"              # 浅灰背景
    after:
      label: "MI 自动调账"
      value: "5分钟"
      description: "合同变更→自动识别→冲红→重算→新账单→推送\n全链路事务性保障"
      bg: "green_light"             # 浅绿背景
      accent: "green"
    arrow: "→"                      # 转换箭头（默认 →）
    bottom_bar: { text: "18个集成测试 + 11606个单元测试覆盖 · 生产已验证GO状态", color: "blue" }
    so_what: [...]
    source: "MI商管调账引擎 · G1已归档"

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: domain_funnel — 漏斗递减（如营运域5源归集）
  # ════════════════════════════════════════════════════════════════════════
  - type: domain_funnel
    title: "营运域：销售5源采集，商户好坏有客观依据"
    big_number: { num: "5源", label: "销售数据归集口径", color: "blue" }
    funnel_title: "五源归集 → 统一口径"
    funnel_items: ["POS直连", "商户报数", "客流推算", "抽样调查", "历史推算"]
    # 漏斗自动递减宽度
    summary: "统一口径 → 租售比 · 坪效 · 商户评级 · 异常预警"
    bottom_bar: { text: "租售比超阈值自动标出 · 帮辅建议可执行可闭环", color: "teal" }
    so_what: [...]
    source: "MI商管系统 · 已生产验证"

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: domain_loop — 步骤循环（如物业域工单5步闭环）
  # ════════════════════════════════════════════════════════════════════════
  - type: domain_loop
    title: "物业域：工单闭环不遗失，能耗与应收联动"
    big_number: { num: "5步", label: "工单全闭环", color: "blue" }
    loop: ["报修", "派单", "维修", "验收", "回访"]
    secondary_title: "能耗管理：抄表 → 用量计算 → 应收联动"
    description: "轻资产项目物业人少，工单不进系统就容易丢。系统闭环不遗失，水电费应收不漏。"
    bottom_bar: { text: "SLA监控 · 首次修复率可量化 · 退场协同释放资源快", color: "teal" }
    so_what: [...]
    source: "MI商管系统 · 已生产验证"

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: product_ends — 产品多端展示（如会员CRM三端架构）
  # ════════════════════════════════════════════════════════════════════════
  - type: product_ends
    title: "会员系统：三端架构，把客流沉淀为会员资产"
    ends:                              # 每端一列
      - { name: "管理后台", desc: "标签/分群/画像\n活动/卡券/积分配置" }
      - { name: "会员小程序", desc: "注册/积分/卡券\n活动报名/签到" }
      - { name: "商户助手", desc: "销售报数/对账\n活动核销" }
    reference_line: "已上线案例：流花中心 · 时尚天河 · 广晟财富"
    so_what: [...]
    source: "蓝联会员CRM · 已上线验证"

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: chatbi_pipeline — 智能问数三步管线（问→AI→答）
  # ════════════════════════════════════════════════════════════════════════
  - type: chatbi_pipeline
    title: "智能问数：把经营问题直接变成可读图表"
    step1:                             # ① 自然语言提问
      title: "① 自然语言提问"
      color: "blue"
      items: ["金沙水街本月出租率？", "5项目收缴率排名", "盐步老龙营收下降原因？", "哪个商户租售比异常？"]
    step2:                             # ② AI 引擎
      title: "② AI 引擎"
      color: "ink"
      items: ["语义理解", "SQL 生成", "数据查询", "图表渲染", "归因分析"]
    step3:                             # ③ 秒回结果
      title: "③ 秒回结果"
      color: "green"
      items:                           # 类型+示例对
        - { type: "数字+趋势", example: "出租率 92% ↑3%" }
        - { type: "排名对比", example: "5项目横向排名" }
        - { type: "异常归因", example: "营收↓因出租率↓" }
        - { type: "主动推送", example: "高风险提前预警" }
    bottom_bar: { text: "总经理不用等IT出报表 · 自己问 · AI秒回图表+归因", color: "blue" }
    so_what: [...]
    source: "langchat ChatBI · 智能问数引擎"

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: ai_skill — AI Skill 单页（标题+流程+证明）
  # ════════════════════════════════════════════════════════════════════════
  - type: ai_skill
    title_prefix: "AI·"               # 标题前缀（可选）
    title: "营运分析：日报自动生成，每周省8-10小时"
    flow: ["数据归集", "自动日报", "异常清单", "帮辅建议"]
    proof: "AI省拼表时间，让营运专注帮辅商户"
    so_what: ["5项目营运人力有限", "帮辅建议可执行", "效果可闭环"]
    source: "langchat岗位数字人"

  # ════════════════════════════════════════════════════════════════════════
  # TYPE: value_equation — 价值公式（A − B = C 三列）
  # ════════════════════════════════════════════════════════════════════════
  - type: value_equation
